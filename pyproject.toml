[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "MX8.2ctl"
dynamic = ["version"]
description = "Configure the CHERRY MX 8.2 TKL Wireless keyboard on Linux: lighting, per-key colors, sleep timers, battery"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["cherry", "keyboard", "rgb", "hidraw", "linux"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
gui = ["PySide6"]

[project.scripts]
mx82ctl = "mx82ctl.__main__:main"

[project.urls]
Repository = "https://github.com/justfaked/MX8.2ctl"
Protocol = "https://github.com/justfaked/MX8.2ctl/blob/main/docs/PROTOCOL.md"

[tool.setuptools]
packages = ["mx82ctl"]

[tool.setuptools.dynamic]
version = { attr = "mx82ctl.__version__" }

[tool.setuptools.package-data]
mx82ctl = ["layouts/*.json"]
